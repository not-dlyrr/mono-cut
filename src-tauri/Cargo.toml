[package]
name = "mono-cut"
version = "0.1.0"
description = "Open-source desktop video editor"
authors = ["Mono Cut contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.85"

[lib]
name = "mono_cut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
# Build the WebView2 loader from auditable Rust source, never Microsoft's binary SDK loader.
webview2-com-sys = { path = "vendor/webview2-com-sys" }

[profile.release]
lto = "thin"
codegen-units = 8
strip = "debuginfo"
