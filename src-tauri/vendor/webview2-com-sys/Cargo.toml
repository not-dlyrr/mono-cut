[package]
name = "webview2-com-sys"
version = "0.39.1"
edition = "2021"
rust-version = "1.82"
description = "WebView2 COM bindings with Mono Cut's source-built open runtime loader"
license = "MIT AND ISC"
repository = "https://github.com/wravery/webview2-rs"
readme = "README.md"

[lib]
name = "webview2_com_sys"
path = "src/lib.rs"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation", "Win32_Globalization", "Win32_System_Com",
  "Win32_System_Ole", "Win32_System_Variant", "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging"
]

[dependencies.windows-core]
version = "0.62"

[dev-dependencies]
tempfile = "3"
