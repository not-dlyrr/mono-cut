name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux native development dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential cmake ninja-build pkg-config nasm curl unzip
      - name: macOS media build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config nasm
      - name: Install locked interface dependencies
        run: npm ci
      - name: Check and build interface
        run: npm run check && npm run test:preview && npm run build
      - name: Cache Windows source media build
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            work/media-build
            src-tauri/resources/media
            licenses/media-provenance.json
          key: windows-media-v2-${{ hashFiles('scripts/media-sources.json', 'scripts/build-media.sh', 'scripts/prepare-media.ps1', 'scripts/record-media-provenance.ps1') }}
      - name: Build pinned Windows media components
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-media.ps1 -Jobs 4
      - name: Cache Unix source media build
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            work/media-unix
            src-tauri/resources/media
          key: unix-media-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/media-sources.json', 'scripts/prepare-media-unix.sh') }}
      - name: Build pinned native Unix media components
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/prepare-media-unix.sh
      - name: Unit and actual-media engine tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MONO_CUT_FFMPEG = "$PWD/src-tauri/resources/media/ffmpeg.exe"
          $env:MONO_CUT_FFPROBE = "$PWD/src-tauri/resources/media/ffprobe.exe"
          $env:MONO_CUT_FONT = "$PWD/src-tauri/resources/media/Inter.ttf"
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --nocapture
      - name: Open Windows WebView2 loader tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo test --locked --manifest-path src-tauri/vendor/webview2-com-sys/Cargo.toml -- --nocapture
      - name: Unit and actual-media engine tests (Unix)
        if: runner.os != 'Windows'
        env:
          MONO_CUT_FFMPEG: ${{ github.workspace }}/src-tauri/resources/media/ffmpeg
          MONO_CUT_FFPROBE: ${{ github.workspace }}/src-tauri/resources/media/ffprobe
          MONO_CUT_FONT: ${{ github.workspace }}/src-tauri/resources/media/Inter.ttf
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --nocapture
      - name: Preserve Unix media build provenance
        if: runner.os != 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mono-cut-media-${{ runner.os }}-${{ runner.arch }}
          path: work/media-unix/build-provenance.json
          if-no-files-found: warn
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run desktop:build
      - name: Verify packaged executable, media and notices without launching
        if: runner.os == 'Windows'
        run: node scripts/verify-installer.mjs
      - name: Preserve installer and test artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mono-cut-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
